<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System By Tower Team indonesia</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            user-select: none;
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .top-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(5, 8, 15, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(56, 189, 248, 0.3);
            padding: 12px 20px;
            box-sizing: border-box;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-panel h1 {
            margin: 0;
            font-size: 13px;
            color: #38bdf8;
            letter-spacing: 1.5px;
        }

        .panel-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .clock-text {
            font-size: 11px;
            color: #cbd5e1;
        }

        .clock-text span {
            color: #38bdf8;
            font-weight: bold;
        }

        .back-btn {
            background: rgba(56, 189, 248, 0.2);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            display: none;
            font-weight: bold;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #38bdf8;
            color: #05050a;
        }

        .instruction {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 11px;
            color: #94a3b8;
            pointer-events: none;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Widget Tautan di Pojok Kanan Bawah */
        .link-widget {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(5, 8, 15, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .link-widget:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="top-panel">
        <h1 id="panelTitle">Solar System RealLife System</h1>
        <div class="panel-right">
            <div class="clock-text">Waktu: <span id="clockText">-</span></div>
            <button class="back-btn" id="backBtn" onclick="resetView()">Kembali</button>
        </div>
    </div>

    <div class="instruction">Geser untuk memutar • Scroll untuk zoom • Klik planet untuk detail</div>

    <!-- Widget Tautan Pojok Kanan Bawah (Ganti URL di bawah jika ingin ubah link) -->
    <a href="https://towerteamindonesiacom.vercel.app"target="_blank" class="link-widget" title="Kunjungi Website">🔗</a>

    <div id="webgl-container"></div>

    <script>
        const container = document.getElementById('webgl-container');
        const panelTitle = document.getElementById('panelTitle');
        const backBtn = document.getElementById('backBtn');
        const clockText = document.getElementById('clockText');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 120, 200);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 600;
        controls.minDistance = 10;

        const ambientLight = new THREE.AmbientLight(0x404050, 0.8);
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xffffff, 2.5, 1200, 0.1);
        scene.add(sunLight);

        // Bintang latar belakang
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 2000;
        const starPositions = new Float32Array(starsCount * 3);
        for(let i = 0; i < starsCount * 3; i++) {
            starPositions[i] = (Math.random() - 0.5) * 1500;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        scene.add(new THREE.Points(starsGeometry, new THREE.PointsMaterial({color: 0xffffff, size: 0.8, transparent: true, opacity: 0.8})));

        // Generator Tekstur dengan Bentuk Daratan Bumi Sesuai Asli
        function createTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');

            if (type === 'sun') {
                const grad = ctx.createLinearGradient(0, 0, 0, 512);
                grad.addColorStop(0, '#ffcc00'); grad.addColorStop(0.5, '#ff5500'); grad.addColorStop(1, '#aa1100');
                ctx.fillStyle = grad; ctx.fillRect(0, 0, 1024, 512);
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                for(let i=0; i<200; i++) {
                    ctx.beginPath(); ctx.arc(Math.random()*1024, Math.random()*512, Math.random()*5, 0, Math.PI*2); ctx.fill();
                }
            } else if (type === 'mercury') {
                ctx.fillStyle = '#7a7a7a'; ctx.fillRect(0, 0, 1024, 512);
                for(let i=0; i<600; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#555555' : '#9e9e9e';
                    ctx.fillRect(Math.random()*1024, Math.random()*512, Math.random()*8, Math.random()*8);
                }
            } else if (type === 'venus') {
                const grad = ctx.createLinearGradient(0, 0, 0, 512);
                grad.addColorStop(0, '#c77d33'); grad.addColorStop(0.5, '#e3ab57'); grad.addColorStop(1, '#96521a');
                ctx.fillStyle = grad; ctx.fillRect(0, 0, 1024, 512);
                ctx.fillStyle = 'rgba(255,230,180,0.25)';
                for(let i=0; i<30; i++) ctx.fillRect(0, Math.random()*512, 1024, Math.random()*20);
            } else if (type === 'earth') {
                // Lautan Biru
                ctx.fillStyle = '#0f2c59'; ctx.fillRect(0, 0, 1024, 512);

                // Menggambar Kontur Benua Sesuai Peta Asli
                ctx.fillStyle = '#23532f'; // Hijau Daratan

                // Amerika Utara & Selatan
                ctx.beginPath();
                ctx.moveTo(180, 100); ctx.lineTo(260, 90); ctx.lineTo(300, 140); ctx.lineTo(240, 200); ctx.lineTo(210, 270); ctx.lineTo(260, 350); ctx.lineTo(280, 420); ctx.lineTo(220, 440); ctx.lineTo(190, 360); ctx.lineTo(150, 240); ctx.lineTo(170, 150);
                ctx.closePath(); ctx.fill();

                // Afrika
                ctx.beginPath();
                ctx.moveTo(480, 180); ctx.lineTo(560, 170); ctx.lineTo(580, 270); ctx.lineTo(540, 390); ctx.lineTo(480, 400); ctx.lineTo(450, 280);
                ctx.closePath(); ctx.fill();

                // Eurasia (Eropa & Asia)
                ctx.beginPath();
                ctx.moveTo(450, 70); ctx.lineTo(750, 60); ctx.lineTo(900, 90); ctx.lineTo(950, 180); ctx.lineTo(750, 200); ctx.lineTo(600, 180); ctx.lineTo(500, 140);
                ctx.closePath(); ctx.fill();

                // Asia Tenggara & Indonesia
                ctx.beginPath();
                ctx.arc(830, 280, 35, 0, Math.PI * 2);
                ctx.fill();

                // Australia
                ctx.beginPath();
                ctx.ellipse(820, 380, 60, 40, 0, 0, Math.PI * 2);
                ctx.fill();

                // Greenland
                ctx.beginPath();
                ctx.ellipse(360, 80, 35, 20, 0.2, 0, Math.PI * 2);
                ctx.fill();

                // Es Kutub
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 1024, 45);
                ctx.fillRect(0, 467, 1024, 45);

            } else if (type === 'mars') {
                const grad = ctx.createLinearGradient(0, 0, 0, 512);
                grad.addColorStop(0, '#a83c14'); grad.addColorStop(0.5, '#c94d1e'); grad.addColorStop(1, '#7a2909');
                ctx.fillStyle = grad; ctx.fillRect(0, 0, 1024, 512);
                ctx.fillStyle = '#ffffff'; ctx.fillRect(460, 0, 104, 25);
            } else if (type === 'jupiter') {
                const colors = ['#b86914', '#e09f3e', '#8a480b', '#f2d094', '#5c2d06'];
                for(let i=0; i<35; i++) {
                    ctx.fillStyle = colors[i % colors.length];
                    ctx.fillRect(0, i*(512/35), 1024, 512/35 + 1);
                }
                ctx.fillStyle = '#7a1b0c';
                ctx.beginPath(); ctx.ellipse(700, 340, 70, 45, 0, 0, Math.PI*2); ctx.fill();
            } else if (type === 'saturn') {
                const colors = ['#e6c685', '#fae1ab', '#b59252', '#f2d9a7'];
                for(let i=0; i<30; i++) {
                    ctx.fillStyle = colors[i % colors.length];
                    ctx.fillRect(0, i*(512/30), 1024, 512/30 + 1);
                }
            } else if (type === 'uranus') {
                const grad = ctx.createLinearGradient(0, 0, 0, 512);
                grad.addColorStop(0, '#5eead4'); grad.addColorStop(1, '#0e7490');
                ctx.fillStyle = grad; ctx.fillRect(0, 0, 1024, 512);
            } else if (type === 'neptune') {
                const grad = ctx.createLinearGradient(0, 0, 0, 512);
                grad.addColorStop(0, '#1e3a8a'); grad.addColorStop(1, '#1e40af');
                ctx.fillStyle = grad; ctx.fillRect(0, 0, 1024, 512);
            }
            return new THREE.CanvasTexture(canvas);
        }

        const planetData = [
            { name: "Matahari", radius: 16, distance: 0, periodDays: 1, tilt: 7.25, rotDays: 27, type: 'sun', isSun: true },
            { name: "Merkurius", radius: 2.2, distance: 32, periodDays: 87.97, tilt: 0.03, rotDays: 58.6, type: 'mercury' },
            { name: "Venus", radius: 3.8, distance: 50, periodDays: 224.7, tilt: 177.36, rotDays: -243, type: 'venus' },
            { name: "Bumi", radius: 4, distance: 75, periodDays: 365.25, tilt: 23.44, rotDays: 1.0, type: 'earth' },
            { name: "Mars", radius: 3, distance: 100, periodDays: 686.98, tilt: 25.19, rotDays: 1.03, type: 'mars' },
            { name: "Jupiter", radius: 9, distance: 140, periodDays: 4332.59, tilt: 3.13, rotDays: 0.41, type: 'jupiter' },
            { name: "Saturnus", radius: 7.5, distance: 190, periodDays: 10759.22, tilt: 26.73, rotDays: 0.44, type: 'saturn', hasRings: true },
            { name: "Uranus", radius: 5.2, distance: 240, periodDays: 30685.4, tilt: 97.77, rotDays: -0.72, type: 'uranus', hasRings: true },
            { name: "Neptunus", radius: 5.2, distance: 290, periodDays: 60189.0, tilt: 28.32, rotDays: 0.67, type: 'neptune' }
        ];

        const planets = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const baseEpoch = Date.UTC(2026, 0, 1, 0, 0, 0);

        planetData.forEach(data => {
            const pivotGroup = new THREE.Group();
            scene.add(pivotGroup);

            const tiltGroup = new THREE.Group();
            tiltGroup.rotation.z = THREE.MathUtils.degToRad(data.tilt);
            pivotGroup.add(tiltGroup);

            const geometry = new THREE.SphereGeometry(data.radius, 40, 40);
            const texture = createTexture(data.type);
            
            const material = data.isSun ? 
                new THREE.MeshBasicMaterial({ map: texture }) : 
                new THREE.MeshStandardMaterial({ map: texture, roughness: 0.7, metalness: 0.05 });

            const mesh = new THREE.Mesh(geometry, material);
            tiltGroup.add(mesh);

            if (data.hasRings) {
                const ringGeo = new THREE.RingGeometry(data.radius * 1.25, data.radius * 2.2, 40);
                const ringMat = new THREE.MeshStandardMaterial({ 
                    color: data.name === "Saturnus" ? 0xedd3a3 : 0x67e8f9, 
                    side: THREE.DoubleSide, 
                    transparent: true, 
                    opacity: 0.85,
                    roughness: 0.5
                });
                const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                ringMesh.rotation.x = Math.PI / 2;
                tiltGroup.add(ringMesh);
            }

            if (!data.isSun) {
                const orbitGeo = new THREE.BufferGeometry();
                const points = [];
                for (let i = 0; i <= 64; i++) {
                    const theta = (i / 64) * Math.PI * 2;
                    points.push(new THREE.Vector3(Math.cos(theta) * data.distance, 0, Math.sin(theta) * data.distance));
                }
                orbitGeo.setFromPoints(points);
                scene.add(new THREE.Line(orbitGeo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.08 })));
            }

            planets.push({ pivotGroup, mesh, data });
        });

        let focusedObject = null;
        let targetCameraPos = new THREE.Vector3();
        let targetLookAt = new THREE.Vector3();
        let isTransitioning = false;

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const meshes = planets.map(p => p.mesh);
            const intersects = raycaster.intersectObjects(meshes);

            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                const found = planets.find(p => p.mesh === clickedMesh);

                if (found) {
                    focusedObject = found;
                    isTransitioning = true;
                    panelTitle.innerText = "DETAIL PLANET: " + found.data.name.toUpperCase();
                    backBtn.style.display = 'block';
                }
            }
        });

        window.resetView = function() {
            focusedObject = null;
            isTransitioning = true;
            panelTitle.innerText = "Solar System BY TTID";
            backBtn.style.display = 'none';
        }

        function animate() {
            requestAnimationFrame(animate);

            const now = Date.now();
            const elapsedSeconds = (now - baseEpoch) / 1000;
            const elapsedDays = elapsedSeconds / 86400;

            const realDate = new Date(now);
            clockText.innerText = realDate.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) + " | " + realDate.toLocaleTimeString('id-ID');

            planets.forEach(p => {
                if (!p.data.isSun) {
                    const angle = (2 * Math.PI * elapsedDays) / p.data.periodDays;
                    p.pivotGroup.position.x = Math.cos(angle) * p.data.distance;
                    p.pivotGroup.position.z = Math.sin(angle) * p.data.distance;
                }
                
                const rotAngle = (2 * Math.PI * elapsedDays) / p.data.rotDays;
                p.mesh.rotation.y = rotAngle;
            });

            if (focusedObject) {
                const targetPos = focusedObject.pivotGroup.position;
                targetCameraPos.set(targetPos.x + focusedObject.data.radius * 4, targetPos.y + focusedObject.data.radius * 2, targetPos.z + focusedObject.data.radius * 4);
                targetLookAt.copy(targetPos);

                camera.position.lerp(targetCameraPos, 0.05);
                controls.target.lerp(targetLookAt, 0.05);
                controls.enabled = false;
            } else if (isTransitioning) {
                targetCameraPos.set(0, 120, 200);
                targetLookAt.set(0, 0, 0);

                camera.position.lerp(targetCameraPos, 0.05);
                controls.target.lerp(targetLookAt, 0.05);

                if (camera.position.distanceTo(targetCameraPos) < 1) {
                    isTransitioning = false;
                    controls.enabled = true;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
